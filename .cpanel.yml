# cPanel Git Version Control deploy manifest.
# Clicking "Deploy HEAD Commit" in cPanel runs these tasks: copy the built app
# into place, install any new packages, restart the Node process. No zips, and
# no phpMyAdmin - the API applies its own database migrations on restart.
---
deployment:
  tasks:
    - export DOCROOT=/home/novelcom/klippy.mondobase.com
    - export APIROOT=$DOCROOT/klippy_api
    # Find the cPanel Node virtualenv bin dir rather than hardcoding it (the
    # path changes with the app root / Node version). Fall back to PATH npm.
    - export NODEBIN=$(ls -d /home/novelcom/nodevenv/*/*/bin 2>/dev/null | head -1)
    - export NPM=$([ -x "$NODEBIN/npm" ] && echo "$NODEBIN/npm" || echo npm)
    # --- Web: static frontend into the docroot ---
    - /bin/cp -R web/dist/. $DOCROOT/
    # --- API: replace code, leaving node_modules and tmp in place ---
    - /bin/cp -f api/app.js api/package.json api/package-lock.json $APIROOT/
    - /bin/rm -rf $APIROOT/dist $APIROOT/drizzle
    - /bin/cp -R api/dist api/drizzle $APIROOT/
    - cd $APIROOT && $NPM install --omit=dev --no-audit --no-fund
    # --- Restart the Passenger/Node app ---
    - /bin/mkdir -p $APIROOT/tmp && /usr/bin/touch $APIROOT/tmp/restart.txt
